services:
  app:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3001}
      MEDIA_DIRECTORY: /app/server/uploads
    ports:
      - "${APP_PORT:-3001}:3001"
    volumes:
      - uploads:/app/server/uploads
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  uploads:
